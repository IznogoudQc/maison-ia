[project]
name = "maison-ia"
version = "0.4.2"
description = "Simulation 2D d'une famille de 4 avec dialogues generes par LLM"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=2.3.0",
    "httpx>=0.28.1",
    "keyring>=25.7.0",
    "pydantic>=2.14.2",
    "pygame-ce>=2.5.8",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
    "pytest>=9.2.0",
]
