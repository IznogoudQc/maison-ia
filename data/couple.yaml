# Scénario « terrain » : un jeune couple qui vient d'acheter un lot boisé.
# Même format que family.yaml. Jours : 0 = lundi ... 6 = dimanche.

family:
  - id: maxime
    name: Maxime
    age: 31
    role: chum
    color: [70, 130, 90]
    look: {hair: [70, 50, 34], pants: [60, 70, 96], long_hair: false}
    traits: [débrouillard, optimiste, têtu, travaillant]
    interests: [la menuiserie, la pêche, le hockey, les plans de maison griffonnés sur des napkins]
    routines:
      - Travaille comme charpentier sur des chantiers la semaine
      - Rêve à voix haute de la maison qu'il va bâtir de ses mains
    relations:
      camille: "Sa blonde depuis 6 ans ; il la trouve plus brillante que lui et lui fait confiance pour le budget."
    speech_style: "Enthousiaste, parle de projets, « ça va être malade », « on s'en occupe »."
    bed: tente
    aime: [tourtiere, steak]
    favorite_actions: [jardin, lire]
    salary_per_day: 190
    schedule:
      wake: "06:00"
      sleep: "22:30"
      away: {leave: "07:00", back: "16:30", days: [0, 1, 2, 3, 4], label: travail}
      tasks:
        - {time: "17:15", action: cuisiner, days: [5, 6]}
        - {time: "18:00", action: souper}

  - id: camille
    name: Camille
    age: 29
    role: blonde
    color: [200, 120, 60]
    look: {hair: [40, 30, 28], pants: [80, 60, 70], long_hair: true}
    can_be_pregnant: true     # c'est Camille qui portera le bébé (mettre sur l'autre fiche pour changer)
    traits: [prévoyante, drôle, curieuse, un peu inquiète pour l'argent]
    interests: [le jardinage, les balados, les vieux meubles à retaper, la randonnée]
    routines:
      - Travaille comme infirmière auxiliaire au CLSC
      - Tient le budget dans un cahier et compte chaque dépense
    relations:
      maxime: "Son chum ; elle adore son énergie mais le ramène sur terre quand il rêve trop grand."
    speech_style: "Pince-sans-rire, pose des questions pratiques, « on a-tu les moyens ? », « bon, ok »."
    bed: tente
    aime: [legumes, oeufs]
    favorite_actions: [lire, telephone]
    salary_per_day: 175
    schedule:
      wake: "06:15"
      sleep: "22:00"
      away: {leave: "07:30", back: "16:00", days: [0, 1, 2, 3, 4], label: travail}
      tasks:
        - {time: "17:15", action: cuisiner, days: [0, 1, 2, 3, 4]}
        - {time: "18:00", action: souper}
