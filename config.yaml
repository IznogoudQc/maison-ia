# Configuration de la simulation Maison IA

sim:
  tick_minutes: 1             # minutes simulées par tick
  base_ticks_per_second: 2    # ticks par seconde réelle à la vitesse 1
  speed_multipliers: [1, 3, 10, 30]   # touches 1 à 4
  start_day: 0                # 0 = lundi
  start_time: "06:00"
  move_tiles_per_tick: 3      # vitesse de marche des agents
  seed: 42

display:
  pixel_scale: auto           # agrandissement du pixel art : auto (selon l'écran), ou 1, 1.5, 2, 3
  fps: 60
  hud_width: 360

llm:
  provider: mock              # mock | claude | ollama
  claude_model: claude-haiku-5-5
  claude_effort: low          # low | medium | high
  ollama_url: http://localhost:11434
  ollama_model: llama3.1:8b
  timeout_s: 30
  max_tokens: 1500
  max_calls_per_minute: 12    # limite d'appels par minute réelle
  max_workers: 3
  decisions_enabled: true
  decision_cooldown_minutes: 60
  decision_max_wait_minutes: 20
  mock_latency_s: [0.3, 1.2]
  mock_invalid_rate: 0.05

dialogue:
  pair_cooldown_minutes: 120  # cooldown social par paire (minutes simulées)
  max_participants: 3
  social_gain: 25
  line_display_s: 3.5         # durée d'affichage d'une réplique (secondes réelles)
  history_size: 300
  mode: tour_par_tour         # tour_par_tour : un appel par réplique (chacun son point de vue) ; scene : un appel
  max_turns: 6                # répliques au plus par conversation (tour par tour)
  max_minutes: 45             # conversation abandonnée au-delà (minutes simulées)
  tense_cooldown_factor: 2    # deux personnes en chicane se reparlent moins souvent
  tension_decay_per_day: 8    # la tension retombe avec le temps
  promise_window_minutes: 60  # retard toléré avant qu'une promesse soit brisée
  promise_max_days: 3

memory:
  short_term_size: 30         # événements gardés par agent
  recall_count: 5             # souvenirs envoyés au LLM
  summary_every: 12           # nouveaux événements avant un résumé
  max_summaries: 5
  long_term_size: 40          # souvenirs marquants gardés au-delà de la mémoire courte
  keep_from_importance: 6     # importance (1-10) à partir de laquelle un souvenir va en mémoire longue
  recency_half_life_hours: 24 # la fraîcheur d'un souvenir est divisée par 2 toutes les N heures
  max_beliefs: 6              # constats tirés des réflexions du soir

mind:
  plans_enabled: true         # chaque personnage écrit son plan de la journée au réveil
  reflections_enabled: true   # au coucher : constats sur la journée + objectif du lendemain
  plan_item_window_minutes: 90  # retard toléré avant qu'une activité prévue soit manquée
  max_replans_per_day: 2      # nouveau plan après un imprévu (nouvelle, décès, hôpital)
  goal_boost: 1.5             # poids de l'activité visée par l'objectif du soir

economy:
  enabled: true
  start_money: 1500
  start_pantry: 30            # portions de nourriture au départ
  portion_price: 8            # $ par portion à l'épicerie
  weekly_bills:               # prélevées chaque semaine
    Hypothèque: 370
    Hydro-Québec: 50
    Internet et cellulaires: 55
    Assurances: 40
  bills_weekday: 4            # 0 = lundi ... 4 = vendredi
  grocery_days: 7             # l'épicerie vise N jours de nourriture
  low_pantry_days: 2          # sous ce seuil, l'épicerie devient une option
  overtime_below: 400         # heures sup proposées sous ce solde

health:
  mortality: true             # false : santé à 0 => hôpital quelques jours au lieu de la mort
  starvation_per_hour: 2      # perte de santé par heure quand la faim est à 0
  exhaustion_per_hour: 1      # perte de santé par heure quand l'énergie est à 0
  regen_per_hour: 1.5
  hospital_days: 3
  grief_days: 3

events:
  enabled: true               # mise à pied, facture imprévue, hausse de prix, prime...
  check_time: "08:30"         # tirage quotidien
  frequency: 1.0              # 0 = jamais, 2 = deux fois plus souvent

world:
  scenario: maison            # maison : la famille Gagnon et sa maison ; terrain : un couple, une tente, un lot à bâtir
  terrain:
    width: 120                # tuiles (la caméra défile : flèches, clic droit glissé, molette = zoom)
    height: 80
    seed: null                # null = sim.seed ; même graine = même forêt
    tree_density: 1.0
    family_file: data/couple.yaml
    start_money: 3000
    start_pantry: 20
    weekly_bills:
      Taxes du terrain: 35
      Cellulaires: 45
      Assurances: 15
    instant_build: false      # essai : une pièce du plan se bâtit dès que son emplacement est défriché

family_file: data/family.yaml
save_file: save.json
log_dir: logs
